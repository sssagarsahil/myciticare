<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointment Confirmed - CityCare</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: "#074469",
                        "primary-container": "#2a5c82",
                        "on-primary": "#ffffff",
                        surface: "#f9f9ff",
                        "on-surface": "#111c2d",
                        "on-surface-variant": "#41474e",
                        "outline-variant": "#c1c7cf",
                        secondary: "#006e1c",
                        "secondary-container": "#91f78e",
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f9f9ff; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl border border-outline-variant/30 overflow-hidden text-center p-10 animate-fade-in">
        <div class="w-20 h-20 bg-secondary-container text-secondary rounded-full flex items-center justify-center mx-auto mb-8">
            <span class="material-symbols-outlined text-4xl" style="font-variation-settings: 'FILL' 1;">check_circle</span>
        </div>
        
        <h1 class="text-3xl font-bold text-on-surface mb-4">Appointment Confirmed!</h1>
        <p class="text-on-surface-variant mb-10 text-lg">Your visit with <span class="font-bold text-on-surface">Dr. Sarah Jenkins</span> has been successfully scheduled.</p>
        
        <div class="bg-surface rounded-2xl p-6 mb-10 border border-outline-variant/20 text-left">
            <div class="flex items-center gap-4 mb-4">
                <span class="material-symbols-outlined text-primary">calendar_today</span>
                <div>
                    <p class="text-sm text-on-surface-variant uppercase font-bold tracking-wider">Date & Time</p>
                    <p class="font-bold text-on-surface text-lg">Tuesday, Oct 17 • 01:45 PM</p>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <span class="material-symbols-outlined text-primary">location_on</span>
                <div>
                    <p class="text-sm text-on-surface-variant uppercase font-bold tracking-wider">Location</p>
                    <p class="font-bold text-on-surface text-lg">Central Medical Plaza, Ste 402</p>
                </div>
            </div>
        </div>
        
        <div class="space-y-4">
            <a href="../patient_dashboard_web/code.html" class="block w-full py-4 bg-primary text-on-primary font-bold rounded-xl shadow-lg hover:opacity-90 active:scale-95 transition-all">
                Go to Dashboard
            </a>
            <button class="block w-full py-4 text-primary font-bold hover:bg-surface rounded-xl transition-all border border-outline-variant/30">
                Add to Calendar
            </button>
        </div>
        
        <p class="mt-8 text-sm text-on-surface-variant">
            A confirmation email has been sent to your registered address.
        </p>
    </div>
</body>
</html>
