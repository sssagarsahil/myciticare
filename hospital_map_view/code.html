<!DOCTYPE html>

<html class="h-full" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>CityCare - Map View</title>
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Inter -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'clinical-blue': '#2a5c82',
            'clinical-gray': '#f4f7f9',
            'clinical-text': '#1a202c',
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
        }
      }
    }
  </script>
<style data-purpose="layout-styles">
    /* Prevent scrolling on the body to maintain the mobile app feel */
    body {
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    
    /* Map Background Simulation */
    .map-container {
      background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBDnyKaIGurbnfVSeAiIpVmQryxOIIL5mD8U5LWw6durz1bXU7Od45L9vd7KbDgA-raI1rWIRTCtCJnn_2gOS8-iRbKWJ5wTYEvb9fTgsrP107IxO48mbbWZAjYht2Owt-QWB_56vxGVwlWNBaCCXC3W0w1u7ilwuMmhD2amVbMdVhBKTx2oaGiUWELbq-w7i1TGHaX9t3PIXHQ7XPjZMig79k0tUcjTIbuUe6r5JC-S8awwRmNKk1bvMLGqNKqdgWk8SGTSn9fuQ');
      background-size: cover;
      background-position: center;
      height: 100vh;
      width: 100%;
      position: relative;
    }

    /* Safe Area Insets for iOS */
    .pb-safe {
      padding-bottom: env(safe-area-inset-bottom);
    }
    .pt-safe {
      padding-top: env(safe-area-inset-top);
    }

    /* Custom shadow for floating elements */
    .clinical-shadow {
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }
  </style>
</head>
<body class="font-sans antialiased bg-gray-100">
<!-- BEGIN: Main App Container -->
<main class="relative h-screen w-full flex flex-col overflow-hidden max-w-[430px] mx-auto bg-white border-x border-gray-200">
<!-- BEGIN: Map View Area -->
<div class="map-container flex-grow relative" data-purpose="interactive-map">
<!-- BEGIN: Top Search Bar -->
<div class="absolute top-0 left-0 w-full px-4 pt-12 z-10" data-purpose="search-header">
<div class="flex items-center gap-2">
<div class="flex-grow relative shadow-lg">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</span>
<input class="block w-full pl-10 pr-3 py-3 border-none rounded-xl text-sm placeholder-gray-500 focus:ring-2 focus:ring-clinical-blue focus:outline-none clinical-shadow" placeholder="Search for doctors, hospitals..." type="text"/>
</div>
<button aria-label="Filter" class="bg-white p-3 rounded-xl clinical-shadow focus:outline-none">
<svg class="w-6 h-6 text-clinical-blue" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
</div>
</div>
<!-- END: Top Search Bar -->
<!-- BEGIN: Hospital Info Card -->
<div class="absolute bottom-6 left-0 w-full px-4 z-10" data-purpose="floating-hospital-card">
<div class="bg-white rounded-3xl p-4 clinical-shadow">
<div class="flex gap-4">
<!-- Hospital Image -->
<div class="w-24 h-24 rounded-2xl overflow-hidden flex-shrink-0">
<img alt="Central City Hospital" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBg9Xu1iWvO7bmMgdx3YufWaaiAe5zeE1tAlbAOWE8ArX5gIL2-VPSgaWUXA---RHjC3apgTt3uwcVwk7biNmUhDK-Zs90lI7jST7Qb_l0ZGjeK5o3xOR-bWw8AUK-ePeFr4zKjItwtCTCs9aMhtpLIMjNFH99AlUvNggjXMPnXUc6Il8bX4BlB6QcSQ0CtptR1rIwiTOwyRawD_uvNo80jYCCzXFJ2w_CGKT_dOluk9CIHuNLzVbVe7JiAbA6yZYmqv5hwT5hmsQ"/>
</div>
<!-- Hospital Details -->
<div class="flex-grow flex flex-col justify-center">
<h3 class="text-lg font-bold text-clinical-text">Central City Hospital</h3>
<div class="flex items-center mt-1">
<span class="text-sm font-semibold text-gray-700 mr-1">4.8</span>
<div class="flex text-yellow-400">
<svg class="w-4 h-4 fill-current" viewbox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path></svg>
<svg class="w-4 h-4 fill-current" viewbox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path></svg>
<svg class="w-4 h-4 fill-current" viewbox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path></svg>
<svg class="w-4 h-4 fill-current" viewbox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path></svg>
<svg class="w-4 h-4 fill-current opacity-50" viewbox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path></svg>
</div>
</div>
<p class="text-sm text-gray-500 mt-1">2.4 miles away</p>
</div>
</div>
<!-- CTA Button -->
<button class="w-full mt-4 bg-clinical-blue text-white py-3.5 rounded-xl font-semibold transition-colors active:bg-opacity-90">
            View Details
          </button>
</div>
</div>
<!-- END: Hospital Info Card -->
</div>
<!-- END: Map View Area -->
<!-- BEGIN: Bottom Navigation Bar -->
<nav class="bg-white border-t border-gray-100 flex justify-around items-center pt-3 pb-safe" data-purpose="bottom-navigation">
<!-- Home -->
<a class="flex flex-col items-center gap-1 group" href="#">
<svg class="w-6 h-6 text-gray-400 group-hover:text-clinical-blue" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
<span class="text-[10px] font-medium text-gray-400 group-hover:text-clinical-blue">Home</span>
</a>
<!-- Search (Active) -->
<a class="flex flex-col items-center gap-1" href="#">
<svg class="w-6 h-6 text-clinical-blue" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
<span class="text-[10px] font-medium text-clinical-blue">Search</span>
</a>
<!-- Appointments -->
<a class="flex flex-col items-center gap-1 group" href="#">
<svg class="w-6 h-6 text-gray-400 group-hover:text-clinical-blue" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
<span class="text-[10px] font-medium text-gray-400 group-hover:text-clinical-blue">Appointments</span>
</a>
<!-- Profile -->
<a class="flex flex-col items-center gap-1 group" href="#">
<svg class="w-6 h-6 text-gray-400 group-hover:text-clinical-blue" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
<span class="text-[10px] font-medium text-gray-400 group-hover:text-clinical-blue">Profile</span>
</a>
<!-- Settings -->
<a class="flex flex-col items-center gap-1 group" href="#">
<svg class="w-6 h-6 text-gray-400 group-hover:text-clinical-blue" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
<path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
<span class="text-[10px] font-medium text-gray-400 group-hover:text-clinical-blue">Settings</span>
</a>
</nav>
<!-- END: Bottom Navigation Bar -->
<!-- iPhone Home Indicator -->
<div class="h-1.5 w-32 bg-gray-200 rounded-full mx-auto mb-2 shrink-0"></div>
</main>
<!-- END: Main App Container -->
</body></html>
