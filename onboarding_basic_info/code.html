            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;

<body class="bg-background text-on-background min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="flex justify-between items-center px-margin-mobile h-16 w-full z-50 shadow-sm dark:shadow-none bg-surface dark:bg-on-background sticky top-0">
<div class="flex items-center gap-base">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed-dim" data-icon="medical_services">medical_services</span>
<h1 class="text-headline-md font-headline-md font-bold text-primary dark:text-primary-fixed-dim">CityCare</h1>
</div>
<div class="w-10 h-10 rounded-full bg-surface-container-highest overflow-hidden">
<img alt="User Profile" class="w-full h-full object-cover" data-alt="A clean, professional placeholder for a user profile avatar. The design is minimalist, using a soft grey silhouette against a neutral, high-key white background. The lighting is even and sterile, reflecting the clinical and modern medical brand identity of CityCare." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCTEE1v54Of7UH7r0BpHKK-WP5u2eHXBm0yCIBfbd91KNCqEwNiUsP1XKLERx1EPlUI8ZgkqLweQNimy4m79Hm-60n9NxWQL9ptTbfOSgAIqGygrjkgkGbLPM3ygi10WWYOkd_iNfQrgq0tlD37n2w1YfoXnOVLZwKQJAOdooJb7wmXyr7_PNA4hCrj9oMuAvxFZfT0lg99-jhaQ1qQe8u_op5C9XgOK2lRHRawG2W-fKXwt1Jb_UOQ8nB4e-djv5i5Kmjc8uLiLw"/>
</div>
</header>
<main class="flex-grow flex flex-col items-center py-xl px-margin-mobile">
<div class="w-full max-w-[600px] flex flex-col gap-lg">
<!-- Progress Indicator -->
<div class="w-full">
<div class="flex justify-between items-end mb-sm">
<div>
<span class="text-label-sm font-label-sm text-primary uppercase tracking-wider">Step 1 of 4</span>
<h2 class="text-headline-md font-headline-md text-on-surface block">Basic Information</h2>
</div>
<span class="text-label-md font-label-md text-outline">25% Complete</span>
</div>
<div class="w-full h-2 bg-surface-container-highest rounded-full overflow-hidden">
<div class="h-full bg-primary w-1/4 rounded-full transition-all duration-500"></div>
</div>
</div>
<!-- Onboarding Form Card -->
<section class="bg-surface-container-lowest rounded-xl shadow-[0_4px_20px_rgba(30,41,59,0.05)] p-md md:p-xl flex flex-col gap-lg">
<div class="flex flex-col gap-base">
<p class="text-body-md font-body-md text-on-surface-variant">Please provide your legal details to help us set up your digital health record securely.</p>
</div>
<form class="flex flex-col gap-md">
<!-- Full Name -->
<div class="flex flex-col gap-xs">
<label class="text-label-md font-label-md text-on-surface-variant" for="full_name">Full Name</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline" data-icon="person">person</span>
<input class="w-full pl-12 pr-4 py-3 bg-surface-container-lowest border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all outline-none text-body-md" id="full_name" placeholder="e.g. Dr. Jane Smith" type="text"/>
</div>
</div>
<!-- Date of Birth -->
<div class="flex flex-col gap-xs">
<label class="text-label-md font-label-md text-on-surface-variant" for="dob">Date of Birth</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline" data-icon="calendar_today">calendar_today</span>
<input class="w-full pl-12 pr-4 py-3 bg-surface-container-lowest border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all outline-none text-body-md" id="dob" type="date"/>
</div>
</div>
<!-- Phone Number -->
<div class="flex flex-col gap-xs">
<label class="text-label-md font-label-md text-on-surface-variant" for="phone">Phone Number</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline" data-icon="call">call</span>
<input class="w-full pl-12 pr-4 py-3 bg-surface-container-lowest border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all outline-none text-body-md" id="phone" placeholder="+1 (555) 000-0000" type="tel"/>
</div>
<span class="text-label-sm font-label-sm text-outline-variant">We'll send a verification code to this number.</span>
</div>
<!-- CTA Section -->
<div class="mt-base flex flex-col gap-md">
<button class="w-full bg-primary text-on-primary py-4 rounded-lg font-label-md text-label-md shadow-sm hover:opacity-90 active:scale-95 transition-all flex justify-center items-center gap-base" type="submit">
                            Continue
                            <span class="material-symbols-outlined text-[18px]" data-icon="arrow_forward">arrow_forward</span>
</button>
<button class="w-full text-primary border border-primary py-4 rounded-lg font-label-md text-label-md hover:bg-surface-container-low transition-all" type="button">
                            Save and Exit
                        </button>
</div>
</form>
</section>
<!-- Decorative Visual Support (Asymmetric Layout Hint) -->
<div class="hidden lg:block fixed right-margin-desktop top-1/2 -translate-y-1/2 w-80 pointer-events-none opacity-40">
<div class="relative">
<div class="absolute -z-10 w-64 h-64 bg-primary-fixed rounded-full blur-3xl opacity-30"></div>
<img alt="Medical Trust" class="rounded-xl shadow-lg border-4 border-surface" data-alt="A macro photograph of a high-tech medical verification device, emphasizing clean metallic surfaces and soft blue indicator lights. The image is bright and airy, with a shallow depth of field focusing on the precision of the hardware. The aesthetic is ultra-modern corporate healthcare, conveying a sense of security and technological advancement consistent with CityCare's branding." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDOzMC0N_i5ue_IK1K0RHEo1EfyGaYgvfzQX5YDlZCJs1rDD-0hbJcbmXwiPFhwUvcZI1CTYGOkWGjf5zBrIl4otX55O6mQ8zZn0dM25bp118lh6dL4SAMDSiG7WfIfNGjunMuf6-ck13WKUR-MoeR_C2lWYvC1IveWPYq6KzLZlpb9tXrO9FOUl8VNXzHwug2OHD-hOoWkwidUj4T_cYCGQS9wug7EDvk5NmbbnjgJLx6WhwmChO8La-Rzkedhs4XaTE-Z0acP2Q"/>
</div>
</div>
</div>
</main>
<!-- Contextual Footer (Help Only) -->
<footer class="py-md text-center">
<p class="text-label-sm font-label-sm text-outline-variant">Need help? <a class="text-primary font-bold hover:underline" href="#">Contact Support</a></p>
</footer>
</body></html>
